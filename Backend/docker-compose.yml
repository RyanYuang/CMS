services:
  api:
    build: .
    container_name: leowong-cms-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://cms:cms_pass@db:5432/leowong_cms
      - APP_PORT=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cms_uploads:/app/var/uploads
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    container_name: leowong-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: leowong_cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_pass
    volumes:
      - cms_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d leowong_cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  cms_pg:
  cms_uploads:
