services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD:-cms_pass}@db:5432/${POSTGRES_DB:-leowong_cms}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cms_uploads:/app/var/uploads
    ports:
      - "${API_PORT:-18000}:8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leowong_cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_pass}
    volumes:
      - cms_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-leowong_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cms_pg:
  cms_uploads:
